general {
	hide_cursor = true
	ignore_empty_input = true
	fail_timout = 0
}

animations {
	enabled = true

	bezier = bounce, 0.5, 1.5, 0.5, -0.5
	bezier = jump,   1,   0,   0,   0
	bezier = linear, 0,   0,   1,   1

	animation = fadeIn,         1, 2.5, jump
	animation = fadeOut,        1, 2.5, jump
	animation = inputFieldDots, 1, 2.5, bounce
}

background {
	monitor =
	path = screenshot
	blur_size = 8
	blur_passes = 2
	noise = 0
	contrast = 0.75
	brightness = 0.50
	vibrancy = 0.25
}

input-field {
	monitor =
	size = 30%, 5%

	outline_thickness = 0
	inner_color = rgba(ffffffa6)

	font_color = rgb(26203aa6)
	fade_on_empty = false
	fade_timout = 250
	rounding = 8

	font_family = JetBrainsMono Nerd Font Propo
	placeholder_text = __ __ __ __ __ __ __ __
	fail_text = __ __ __ __ __ __ __ __

	check_color = rgba(26703abf)
	fail_color = rgba(71203abf)

	dots_text_format = *
	dots_size = 0.5
	dots_spacing = 0.125

	position = 0, -8
	halign = center
	valign = top
}

label {
	monitor =
	text = cmd[update:60000] date +"%I:%M %a %d"
	font_size = 32
	font_family = JetBrainsMono Nerd Font Propo

	position = 0, -62
	halign = center
	valign = top
}
