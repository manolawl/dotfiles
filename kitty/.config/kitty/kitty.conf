# Shell
shell_integration enabled no-cursor

# Window
background_opacity 0.75
dim_opacity 0.75

# Font
font_family JetBrainsMono Nerd Font
font_size 12

# Cursor
cursor #FFB0AE
cursor_text_color #26203A
cursor_shape block
cursor_blink_interval 0.25
cursor_trail 1
cursor_trail_decay 0.1 0.5
cursor_trail_start_threshold 0

# Primary colors
foreground #FFFFFF
background #26203A
selection_foreground #26203A
selection_background #FFB0AE

# Normal colors
color0  #4B4074
color1  #E24074
color2  #4BDF74
color3  #E2DF74
color4  #4B40F9
color5  #E240F9
color6  #4BDFF9
color7  #E2DFF9

# Bright colors
color8  #7160AE
color9  #FF60AE
color10 #71FFAE
color11 #FFFFAE
color12 #7160FF
color13 #FF60FF
color14 #71FFFF
color15 #FFFFFF
