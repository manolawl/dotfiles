general {
  gaps_in = 4
  gaps_out = 8
  border_size = 4
  col.active_border = rgb(7160ae)
  col.inactive_border = rgb(4b4074)
  resize_on_border = false
  allow_tearing = true
  layout = scrolling
}

decoration {
  rounding = 8
  rounding_power = 2
  active_opacity = 1
  inactive_opacity = 1

  shadow {
    enabled = false
    range = 4
    render_power = 2
    color = rgb(4B4074)
  }

  blur {
    enabled = true
    size = 8
    passes = 2
    vibrancy = 0
  }
}

dwindle {
  pseudotile = true 
  preserve_split = true 
}

scrolling {
  fullscreen_on_one_column = true
  focus_fit_method = 1
  column_width = 0.333333333 # One Window per Column
  direction = right
}

misc {
  force_default_wallpaper = 1 
  disable_hyprland_logo = true 
  vfr = true 
  font_family = "JetBrainsMono Nerd Font"
}
