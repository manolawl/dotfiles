general {
  gaps_in = 2
  gaps_out = 4
  border_size = 0
  col.active_border = none 
  col.inactive_border = none
  resize_on_border = false
  allow_tearing = true
  layout = scrolling
}

decoration {
  rounding = 0
  rounding_power = 0

  active_opacity = 1
  inactive_opacity = 1

  shadow {
    enabled = false
    range = 8
    render_power = 1
    color = rgb(251F39)
  }

  blur {
    enabled = false
    size = 16
    passes = 1
    vibrancy = 0
  }
}

dwindle {
  pseudotile = true 
  preserve_split = true 
}

scrolling {
  fullscreen_on_one_column = true
  focus_fit_method = 1
  column_width = 1
  direction = right
}

misc {
  force_default_wallpaper = 1 
  disable_hyprland_logo = true 
  font_family = "JetBrainsMono Nerd Font"
}
