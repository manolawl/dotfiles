general {
  gaps_in = 1
  gaps_out = 2
  border_size = 4
  col.active_border = rgb(715FAD) 
  col.inactive_border = rgb(251F39)
  resize_on_border = false
  allow_tearing = false
  layout = dwindle
}

decoration {
  rounding = 4
  rounding_power = 2

  active_opacity = 1
  inactive_opacity = 1

  shadow {
    enabled = true
    range = 8
    render_power = 1
    color = rgb(251F39)
  }

  blur {
    enabled = true
    size = 16
    passes = 1

    vibrancy = 0
  }
}

dwindle {
  pseudotile = true 
  preserve_split = true 
}

misc {
  force_default_wallpaper = 1 
  disable_hyprland_logo = true 
  font_family = "DeJaVuSansM Nerd Font Mono"
}
