general {
  gaps_in = 2
  gaps_out = 4
  border_size = 2
  col.active_border = rgb(4BDFB6)
  col.inactive_border = rgba(4B407480)
  resize_on_border = false
  allow_tearing = true
  layout = scrolling
}

decoration {
  rounding = 4
  rounding_power = 2

  active_opacity = 1
  inactive_opacity = 1

  shadow {
    enabled = false
    range = 4
    render_power = 2
    color = rgb(4B4074)
  }

  blur {
    enabled = true
    size = 8
    passes = 2
    vibrancy = 0
  }
}

dwindle {
  pseudotile = true 
  preserve_split = true 
}

scrolling {
  fullscreen_on_one_column = true
  focus_fit_method = 1
  column_width = 1 # One Window per Column
  direction = right
}

misc {
  force_default_wallpaper = 1 
  disable_hyprland_logo = true 
  vfr = true 
  font_family = "JetBrainsMono Nerd Font"
}

render {
  cm_sdr_eotf = 2 # Fixes colors in kitty
}
