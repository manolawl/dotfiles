general {
  gaps_in = 4
  gaps_out = 8
  border_size = 0
  col.active_border = rgba(000000bf) rgb(e240f9) rgb(e24074) rgb(e29074) rgb(97df74) rgb(4bdf74) rgb(4bdff9) rgb(4b90f9) rgb(9740f9) rgba(000000bf) 0deg
  col.inactive_border = rgba(000000bf)
  resize_on_border = false
  allow_tearing = true
  layout = scrolling
}

decoration {
  rounding = 4
  rounding_power = 2
  active_opacity = 1
  inactive_opacity = 1

  shadow {
    enabled = false
    range = 4
    render_power = 2
    color = rgb(404040)
  }

  blur {
    enabled = true
    size = 4
    passes = 2
    vibrancy = 0
  }
}

dwindle {
  pseudotile = true 
  preserve_split = true 
}

scrolling {
  fullscreen_on_one_column = true
  focus_fit_method = 0
  column_width = 0.333333333 
  direction = right
}

xwayland {
  force_zero_scaling = true
  use_nearest_neighbor = true
}

cursor {
  default_monitor = eDP-1
}

misc {
  force_default_wallpaper = 1 
  disable_hyprland_logo = true 
  vfr = true 
  font_family = "JetBrainsMono Nerd Font Propo"
}
