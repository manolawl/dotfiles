animations {
  enabled = true

  bezier = bounce, 0.5, 1.5, 0.5, -0.5
  bezier = jump, 1, 0, 0, 0

  #       NAME,      ONOFF, SPEED, CURVE,    [STYLE]
  animation = global,        1, 2, jump
  animation = border,        1, 4, jump
  animation = windows,       1, 2, jump
  animation = windowsIn,     0, 2, jump
  animation = windowsOut,    0, 4, jump
  animation = fadeIn,        1, 4, jump
  animation = fadeOut,       1, 2, jump
  animation = fade,          1, 2, jump
  animation = layers,        1, 2, jump
  animation = layersIn,      0, 4, jump
  animation = layersOut,     0, 4, jump
  animation = fadeLayersIn,  1, 4, jump
  animation = fadeLayersOut, 1, 2, jump
  animation = workspaces,    1, 2, jump
  animation = workspacesIn,  1, 2, jump
  animation = workspacesOut, 1, 4, jump
  animation = zoomFactor,    1, 4, jump
}
