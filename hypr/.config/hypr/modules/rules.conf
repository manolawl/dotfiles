# ignores maximize requests from all apps
windowrule {
  name = suppress-maximize-events
  match:class = .*
  suppress_event = maximize
}

# fixes some dragging issues with xwayland
windowrule {
  name = fix-xwayland-drags
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
  no_focus = true
}

# hyprland-run windowrule
windowrule {
  name = move-hyprland-run
  match:class = hyprland-run
  move = 20 monitor_h-120
  float = yes
}

windowrule {
  name = wev_float
  match:class = wev
  float = yes
}

# blurs waybar
layerrule {
  name = waybar_blur
  blur = on
  ignore_alpha = 0.2
  match:namespace = waybar
}

# blurs swaync
layerrule {
  name = swaync_blur
  blur = on
  ignore_alpha = 0.2
  match:namespace = swaync-control-center
}

# persistent workspaces
workspace = 1, persistent:true, monitor:eDP-1
workspace = 2, persistent:true, layout:dwindle, monitor:eDP-1
workspace = 3, persistent:true, layout:dwindle, monitor:HDMI-A-2
