input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options = caps:escape # bind caps-lock to escape
  kb_rules =
  accel_profile = flat # disable mouse acceleration
  follow_mouse = 1

  sensitivity = 0 #default sensitivity
  touchpad {
    natural_scroll = true # phone-like scrolling
    scroll_factor = 0.5
  }
}

# touchpad settings
device {
  name = pixa3848:00-093a:3848-touchpad
  sensitivity = 0.25
}

# hyprland exit
bind = SUPER, Escape, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# plugin binds
# bind = SUPER, ESCAPE, hyprexpo:expo, toggle # Shows All Windows

# config reload
bind = SUPER, R, exec, hyprctl reload 
bind = SUPER, R, exec, swaync-client -R && swaync-client -rs 
bind = SUPER, R, exec, pkill waybar && waybar 

# minimal config toggle
bind = SUPER, F1, exec, ~/dotfiles/scripts/gamemode.sh

# basic window management
bind = SUPER, F, togglefloating,
bind = SUPER, F, resizeactive, exact 75% 75%
bind = , F11, fullscreen,
bind = SUPER, S, layoutmsg, togglesplit
bind = SUPER, Q, killactive,

# window focus
gesture = 3, left, dispatcher, layoutmsg, move +col 
gesture = 3, right, dispatcher, layoutmsg, move -col
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# window swap
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, J, swapwindow, d
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, L, swapwindow, r

# window move
bindm = SUPER, mouse:272, movewindow
bind = ALT SHIFT, H, moveactive, -64 0
bind = ALT SHIFT, J, moveactive, 0 64 
bind = ALT SHIFT, K, moveactive, 0 -64 
bind = ALT SHIFT, L, moveactive, 64 0

# window resize
bindm = SUPER, mouse:273, resizewindow
bind = CONTROL SHIFT, H, resizeactive, -128 0
bind = CONTROL SHIFT, J, resizeactive, 0 -128 
bind = CONTROL SHIFT, K, resizeactive, 0 128 
bind = CONTROL SHIFT, L, resizeactive, 128 0

# workspace switch
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3

# window move to workspace
bind = SUPER CONTROL, 1, movetoworkspace, 1
bind = SUPER CONTROL, 2, movetoworkspace, 2
bind = SUPER CONTROL, 3, movetoworkspace, 3

# program run
bind = SUPER, T, exec, $terminal
bind = SUPER, E, exec, [float; size 1080 720] $file_manager
bind = SUPER, B, exec, $browser
bind = SUPER, P, exec, $image_viewer
bind = SUPER, M, exec, [float; size 1080 1068; move 420 6] $system_monitor
bind = SUPER, Space, exec, $application_launcher
bind = SUPER, C, exec, hyprpicker -a -f hex -n -u 256 -s 10 # runs color picker
bind = , Print, exec, hyprshot -m region -o ~/Pictures/screenshots/
bind = SUPER, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy # opens clipboard

# audio controls
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# brightness controls
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
