# Runs Applications 
bind = SUPER, T, exec, $terminal
bind = SUPER, E, exec, [float; size 1080 720] $fileManager
bind = SUPER, A, exec, $appLauncher
bind = SUPER, B, exec, $browser
bind = CONTROL SHIFT, ESCAPE, exec, [float; size 1080 1068; move 420 6] $sysMonitor

# Closes Focused Window
bind = SUPER, Q, killactive,

# Properly Exits Hyprland
bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# Floats Focused Window
bind = SUPER, F, togglefloating,

# Reloads Configs
bind = SUPER, R, exec, hyprctl reload 
bind = SUPER, R, exec, swaync-client -R && swaync-client -rs 
bind = SUPER, R, exec, pkill waybar && waybar &

# Turns Off Decorations
bind = SUPER, F1, exec, ~/dotfiles/scripts/gamemode.sh

# Runs Color Picker
bind = SUPER, P, exec, hyprpicker

# Runs Screenshot Utility
bind = SUPER, S, exec, hyprshot -m region -o ~/Pictures/screenshots/

# Opens Clipboard
bind = SUPER, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy

# Moves Focus to Adjacent Window (Vim Motions)
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Changes Workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

# Moves Focused Window to Different Workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

# Mouse Binds
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Switch Layouts
bind = SUPER ALT, D, exec, hyprctl keyword general:layout "dwindle"
bind = SUPER ALT, S, exec, hyprctl keyword general:layout "scrolling"

# Audio Controls
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness Controls
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media Player Controls
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Plugin Binds
bind = SUPER, ESCAPE, hyprexpo:expo, toggle # Shows All Windows

# Input Settings
input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options = caps:escape # Bind Caps-Lock to Escape
  kb_rules =
  accel_profile = flat # No Mouse Acceleration

  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = true # Phone-like Scrolling
    scroll_factor = 0.5
  }
}

# Touchpad Settings
device {
  name = pixa3848:00-093a:3848-touchpad
  sensitivity = 0.25
}

# Custom Gestures
gesture = 3, left, dispatcher, layoutmsg, move +col # Focuses to the right
gesture = 3, right, dispatcher, layoutmsg, move -col # Focuses to the left
gesture = 3, down, dispatcher, hyprexpo:expo, toggle
