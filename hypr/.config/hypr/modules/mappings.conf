# basic window management
bind = SUPER, S, layoutmsg, togglesplit
bind = SUPER, Escape, exec, hyprlock

# window focus
gesture = 3, left, dispatcher, layoutmsg, move +col 
gesture = 3, right, dispatcher, layoutmsg, move -col


# window resize
bindm = SUPER, mouse:273, resizewindow

# program run
bind = , XF86Presentation, exec, [float; size 1280 720; center] $system_monitor
bind = SUPER SHIFT, F23, exec, kitty nvim .
bind = SUPER, C, exec, hyprpicker -a -f hex -n -u 256 -s 10 
bind = , Print, exec, hyprshot -m region
#bind = , Print, exec, grim -t png -g $(slurp)
bind = SUPER, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy 

# audio controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# brightness controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 25%+
bindel = , XF86MonBrightnessUp, exec, ddcutil setvcp 10 + 25 --noverify --sleep-multiplier=0.2

bindel = , XF86MonBrightnessDown, exec, brightnessctl set 25%-
bindel = , XF86MonBrightnessDown, exec, ddcutil setvcp 10 - 25 --noverify --sleep-multiplier=0.2

bindel = SHIFT, XF86MonBrightnessUp, exec, brightnessctl set 100%
bindel = SHIFT, XF86MonBrightnessUp, exec, ddcutil setvcp 10 100 --noverify --sleep-multiplier=0.2

bindel = SHIFT, XF86MonBrightnessDown, exec, brightnessctl set 0%
bindel = SHIFT, XF86MonBrightnessDown, exec, ddcutil setvcp 10 0 --noverify --sleep-multiplier=0.2
